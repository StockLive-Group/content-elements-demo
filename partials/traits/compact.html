<!-- Compact key traits (accordion / above-the-fold) -->
<div class="sl-ce-traits sl-ce-traits--dense">
  <ul class="sl-ce-traits__list">
    <li class="sl-ce-traits__item sl-ce-traits__item--calving" style="--sl-ce-percentile: 90">

          <span class="sl-ce-traits__name">Birth Weight</span>
          <span class="sl-ce-traits__ebv">EBV +2.1</span>
        </div>
        <span class="sl-ce-badge sl-ce-badge--solid sl-ce-badge--sm sl-ce-badge--pill sl-ce-traits__rank">Top 5%</span>
      </div>
      <div class="sl-ce-traits__track" role="img" aria-label="95th percentile">
        <span class="sl-ce-traits__fill"></span>
      </div>

    <li class="sl-ce-traits__item sl-ce-traits__item--growth" style="--sl-ce-percentile: 92">

      <p class="sl-ce-traits__perc">92nd percentile</p>

    <li class="sl-ce-traits__item sl-ce-traits__item--milk" style="--sl-ce-percentile: 83">
